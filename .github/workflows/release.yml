# Builds Zhuzi for Windows x64 and ARM64 on GitHub's own machines, runs the
# offline tests, and makes a portable zip and an installer for each.
# Pushing a tag like v1.0.0 also drafts a GitHub Release with all four files.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv-${{ matrix.arch }}
          .venv-${{ matrix.arch }}\Scripts\python -m pip install --upgrade pip
          .venv-${{ matrix.arch }}\Scripts\python -m pip install -r requirements.txt

      - name: Offline tests
        shell: pwsh
        run: |
          .venv-${{ matrix.arch }}\Scripts\python tests\test_text.py
          .venv-${{ matrix.arch }}\Scripts\python tests\test_cloud.py

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Arch ${{ matrix.arch }}

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:ZHUZI_VERSION = (Select-String src\core.py 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $env:ZHUZI_ARCH = "${{ matrix.arch }}"
          $env:ZHUZI_SOURCE = (Resolve-Path "dist\Zhuzi-$env:ZHUZI_VERSION-${{ matrix.arch }}").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\zhuzi.iss

      - uses: actions/upload-artifact@v4
        with:
          name: zhuzi-${{ matrix.arch }}
          path: |
            dist/*-portable.zip
            dist/*-setup.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true  # review the notes, then publish by hand
