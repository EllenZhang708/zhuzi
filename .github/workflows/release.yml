# Builds Zhuzi on GitHub's own machines and runs the tests:
#   Windows x64 and ARM64: a portable zip and an installer each;
#   macOS Apple silicon and Intel: a disk image each, after checking the built
#   app end to end (tests/check_mac_app.sh).
# Pushing a tag like v1.1.0 also drafts a GitHub Release with all six files.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv-${{ matrix.arch }}
          .venv-${{ matrix.arch }}\Scripts\python -m pip install --upgrade pip
          .venv-${{ matrix.arch }}\Scripts\python -m pip install -r requirements.txt

      - name: Offline tests
        shell: pwsh
        run: |
          .venv-${{ matrix.arch }}\Scripts\python tests\test_text.py
          .venv-${{ matrix.arch }}\Scripts\python tests\test_cloud.py

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Arch ${{ matrix.arch }}

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:ZHUZI_VERSION = (Select-String -Path src\core.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $env:ZHUZI_ARCH = "${{ matrix.arch }}"
          $env:ZHUZI_SOURCE = (Resolve-Path "dist\Zhuzi-${{ matrix.arch }}").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\zhuzi.iss

      - uses: actions/upload-artifact@v4
        with:
          name: zhuzi-${{ matrix.arch }}
          path: |
            dist/*-portable.zip
            dist/*-setup.exe

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: apple-silicon
            runner: macos-15
          - flavor: intel
            runner: macos-15-intel  # GitHub's last Intel Mac machines
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Python from python.org's installer, not actions/setup-python: that one is
      # compiled on the build machine and would demand its newer macOS of every
      # user. (3.12.10 is the last 3.12 with a macOS installer.)
      - name: Python 3.12 from python.org
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /

      # Only wheels built for macOS 12, the oldest system the app supports (see
      # build_mac.sh): on this newer machine pip would otherwise prefer wheels
      # that need it, such as numpy's macOS 14 ones.
      - name: Install dependencies
        run: |
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 -m venv .venv-mac
          .venv-mac/bin/python -m pip install --upgrade pip
          .venv-mac/bin/python -m pip download --only-binary=:all: --platform "macosx_12_0_$(uname -m)" -d build/wheels -r requirements.txt
          .venv-mac/bin/python -m pip install --no-index --find-links build/wheels -r requirements.txt
          .venv-mac/bin/python -m pip list

      - name: Offline tests
        run: |
          .venv-mac/bin/python tests/test_text.py
          .venv-mac/bin/python tests/test_cloud.py

      - name: Build
        run: bash build_mac.sh

      - name: Check the built app
        run: bash tests/check_mac_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zhuzi-mac-${{ matrix.flavor }}
          path: dist/*.dmg

      # Logs, the test transcript and screenshots of every screen, for review.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-mac-${{ matrix.flavor }}
          path: build/mac/check

  release:
    needs: [build, mac]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: zhuzi-*  # the downloads, not the check reports
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true  # review the notes, then publish by hand
          prerelease: ${{ contains(github.ref_name, '-') }}  # v1.1.0-beta.1: not "latest"
